<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>
<style>
  * { box-sizing: border-box; font-family: "Comic Sans MS", "Poppins", cursive; }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    text-align: center;
    background: rgba(255,255,255,0.85);
    padding: 40px 50px;
    border-radius: 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    position: relative;
    z-index: 1;
  }

  h1 { color: #ff4d6d; margin-bottom: 10px; }

  .cat {
    font-size: 80px;
    margin: 10px 0 20px;
    animation: bounce 2s infinite;
  }

  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

  .buttons { margin-top:30px; position: relative; height: 120px; }

  button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    position: absolute;
    transition: all 0.3s ease;
    z-index: 2;
  }

  #yesBtn { background: #ff4d6d; color: white; left:30%; }
  #noBtn { background: #adb5bd; color: white; left:55%; }

  .heart { position:absolute; color:#ff4d6d; font-size:20px; animation: float 5s linear infinite; opacity:0.8; }

  @keyframes float { 0% {transform:translateY(0) scale(1); opacity:1;} 100% {transform:translateY(-800px) scale(1.5); opacity:0;} }

  .firework {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: gold;
    pointer-events: none;
    animation: explode 1s ease-out forwards;
  }

  @keyframes explode {
    0% {transform: scale(1) translate(0,0); opacity:1;}
    100% {transform: scale(0) translate(var(--x,0),var(--y,0)); opacity:0;}
  }

  .petal {
    position: absolute;
    font-size: 20px;
    pointer-events: none;
    animation: fall 5s linear forwards;
  }

  @keyframes fall {
    0% {transform: translateY(-20px) rotate(0deg);}
    100% {transform: translateY(100vh) rotate(360deg);}
  }
</style>
</head>
<body>

<div class="container">
  <h1>Hirra Ahmad of Chakwal, will you be my Valentine? 💖</h1>
  <div class="cat">🐱</div>

  <div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 🙈</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

// No button runs away
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * 250;
  const y = Math.random() * 80;
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// Hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.bottom = "0px";
  heart.style.fontSize = Math.random() * 20 + 20 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 500); // slightly faster hearts

// Yes button grows + triggers fireworks and petals
let yesScale = 1;
yesBtn.addEventListener("click", () => {
  yesScale += 0.25;
  yesBtn.style.transform = `scale(${yesScale})`;
  createHeart();
  triggerFireworks();
  triggerPetals();
});

// Fireworks
function triggerFireworks() {
  for(let i=0;i<40;i++){  // doubled from 20 to 40
    const fw = document.createElement("div");
    fw.className="firework";
    fw.style.left = Math.random()*window.innerWidth+"px";
    fw.style.top = Math.random()*window.innerHeight+"px";
    fw.style.setProperty('--x',(Math.random()*300-150)+'px'); // wider spread
    fw.style.setProperty('--y',(Math.random()*300-150)+'px');
    document.body.appendChild(fw);
    setTimeout(()=>fw.remove(),1000);
  }
}

// Rose petals
function triggerPetals(){
  for(let i=0;i<40;i++){ // increased from 15 to 40 petals
    const petal = document.createElement("div");
    petal.className="petal";
    petal.innerHTML="🌹";
    petal.style.left = Math.random()*window.innerWidth+"px";
    petal.style.fontSize = (15 + Math.random()*25)+"px"; // bigger range
    document.body.appendChild(petal);
    setTimeout(()=>petal.remove(),5000);
  }
}
</script>

</body>
</html>
